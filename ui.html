// ----- digests to the phone via their own Telegram bot -----
let BOT_STAGE = null, BOT_INFO = null, BOT_POLL = null;
function stopBotPoll() { if (BOT_POLL) { clearInterval(BOT_POLL); BOT_POLL = null; } }

function botPanel(box, opt = {}) {
  stopBotPoll();
  const b = (S.status && S.status.bot) || {};
  const policySel = `<select data-set="phone_send">${[["all", "Every digest"], ["attention", "Only when something needs attention"], ["off", "Don't send"]]
    .map(([v, l]) => `<option value="${v}"${(b.policy || "all") === v ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  if (b.connected) {
    box.innerHTML = `<p class="okc">Connected. Digests arrive in Telegram from <b>@${esc(b.username || "your bot")}</b>, on your phone and everywhere else you use Telegram.</p>
      <label class="opt"><span>Send</span>${policySel}</label>
      <div class="row"><button class="btn ghost" id="bottest" data-busy="Sending…">Send a test message</button><button class="btn ghost" id="botlatest" data-busy="Sending…">Send me the latest digest</button>
        <button class="link" id="botoff" data-busy="Disconnecting…">Disconnect</button><span class="muted" id="botmsg"></span></div>`;
    const msg = t => { $("#botmsg").textContent = t; };
    on("bottest", async () => { try { await api("/api/bot/test", {}); msg("Sent. Check Telegram."); } catch (e) { msg(e.message); } });
    on("botlatest", async () => { try { await api("/api/bot/latest", {}); msg("Sent. Check Telegram."); } catch (e) { msg(e.message); } });
    on("botoff", async () => { await api("/api/bot/disconnect", {}); BOT_STAGE = null; await refreshStatus(); botPanel(box, opt); });
    $$("[data-set]", box).forEach(el => el.onchange = async () => {
      el.disabled = true; el.setAttribute("aria-busy", "true");
      try { await api("/api/settings", { [el.dataset.set]: el.value }); await refreshStatus(); }
      finally { el.disabled = false; el.removeAttribute("aria-busy"); }
    });
    return;
  }
  if (BOT_STAGE === "hello" || b.pending) {
    const uname = (BOT_INFO && BOT_INFO.username) || b.username;
    box.innerHTML = `<ol class="howto" start="2">
        <li><b>Say hello to your bot</b>, so it's allowed to message you. Click the button, and in Telegram press <b>Start</b> at the bottom of the chat.
          <div class="row"><a class="btn" id="botopen" href="${esc((BOT_INFO && BOT_INFO.link) || "#")}" target="_blank" rel="noopener">Open @${esc(uname || "your bot")} in Telegram</a></div>
          <div class="working" id="botwait"><span class="spin"></span><span>Waiting for you to press Start…</span></div>
        </li></ol>
      <div class="row"><button class="link" id="botcheck" data-busy="Checking…">I pressed Start</button><button class="link" id="botback">Use a different bot</button><span class="errc" id="boterr"></span></div>`;
    const check = async () => {
      try {
        const r = await api("/api/bot/check", {});
        if (r.connected) { stopBotPoll(); BOT_STAGE = null; await refreshStatus(); botPanel(box, opt); if (opt.onConnected) opt.onConnected(); }
        else if (r.link) { BOT_INFO = { ...(BOT_INFO || {}), link: r.link }; const a = $("#botopen"); if (a) a.href = r.link; }
      } catch (e) { const el = $("#boterr"); if (el) el.textContent = e.message; }
    };
    if (!BOT_INFO || !BOT_INFO.link) check();
    on("botcheck", check);
    on("botback", async () => { await api("/api/bot/disconnect", {}); BOT_STAGE = null; BOT_INFO = null; await refreshStatus(); botPanel(box, { ...opt, open: true }); });
    let tries = 0;
    BOT_POLL = setInterval(() => { if (!document.body.contains(box) || ++tries > 60) { stopBotPoll(); const w = $("#botwait"); if (w) w.innerHTML = `<span class="muted">Still waiting. After pressing Start, click “I pressed Start”.</span>`; return; } check(); }, 3000);
    return;
  }
  if (!opt.open) {
    box.innerHTML = `<p>Get each digest as a Telegram message from your own private bot: on your phone, and everywhere else you use Telegram. Every point links straight to the original messages. It takes about two minutes.</p>
      <div class="row"><button class="btn ghost" id="botstart">Set it up</button></div>`;
    on("botstart", () => botPanel(box, { ...opt, open: true }));
    return;
  }
  box.innerHTML = `<ol class="howto">
      <li><b>Create your bot.</b> It's free and only talks to you.
        <ol class="sub">
          <li>Open <a href="https://t.me/BotFather" target="_blank" rel="noopener"><b>BotFather</b></a> in Telegram. It's Telegram's official tool for making bots and has a blue tick.</li>
          <li>Press <b>Start</b>, then send <b>/newbot</b>.</li>
          <li>When it asks for a name, send: <b>My Digest</b></li>
          <li>When it asks for a username, send a name ending in “bot”, for example <b>mydigest_2026_bot</b>. If it's taken, add a few numbers.</li>
          <li>BotFather replies with a long <b>token</b> that looks like <span class="mono">123456789:AAH…</span>. Tap it to copy it, and paste it here:</li>
        </ol>
        <div class="row"><input type="password" id="bottoken" placeholder="Paste the token here" autocomplete="off"><button class="btn" id="botsave" data-busy="Connecting…">Connect</button></div>
        <p class="errc" id="boterr"></p>
      </li></ol>`;
  on("botsave", async () => {
    $("#boterr").textContent = "";
    try { BOT_INFO = await api("/api/bot/token", { token: $("#bottoken").value }); BOT_STAGE = "hello"; await refreshStatus(); botPanel(box, opt); }
    catch (e) { $("#boterr").textContent = e.message; }
  });
}

// ----- settings -----
const SCHEDULES = [["h1", "Every hour"], ["h2", "Every 2 hours"], ["h4", "Every 4 hours"], ["h8", "Every 8 hours"], ["h12", "Every 12 hours"],
                   ["daily", "Once a day"], ["after_fetch", "Whenever new messages come in"]];
const scheduleKey = st => st.digest_schedule === "every" ? "h" + st.digest_every_hours : st.digest_schedule;
function scheduleSettings(key) {
  if (key.startsWith("h")) return { digest_schedule: "every", digest_every_hours: +key.slice(1) };
  return { digest_schedule: key };
}
// how messages and digests relate, shown as the two steps they are
function flowSteps(s, st, sel) {
  const d = s.digest || {}, auto = st.digest_mode === "auto";
  const last = s.last_export ? `Last done at ${timeOf(s.last_export)}${s.last_count != null ? `, ${s.last_count ? plural(s.last_count, "new message", "new messages") : "nothing new"}` : ""}. ` : "";
  const how = (SCHEDULES.find(x => x[0] === scheduleKey(st)) || ["", "regularly"])[1].toLowerCase() + (st.digest_schedule === "daily" ? " at " + st.digest_daily_at : "");
  const step2 = auto && d.engine
    ? `<span><b>A digest is written from them</b> ${esc(how)}, when something's new, by ${esc(d.engine_name)}. <button class="link" data-goto="setup:digestset">Change</button></span>`
    : auto ? `<span><b>A digest is written from them</b> once an AI tool is set up on ${HERE()}. <button class="link" data-goto="setup:digestset">See Digests</button></span>`
    : `<span><b>A digest is written from them</b> when you ask. <button class="link" data-goto="setup:digestset">Change</button></span>`;
  return `<ol class="flow">
    <li><span class="how"><b>New messages are copied to ${HERE()}</b> every ${sel("fetch_every_minutes", [[30, "30 minutes"], [60, "hour"], [120, "2 hours"], [240, "4 hours"], [480, "8 hours"]])}</span>
      <span class="muted">${last}You can read them under Messages.</span></li>
    <li>${step2}
      <span class="muted">Right before each digest the app copies the newest messages, so a digest never misses any. Each one covers ${st.digest_period === "last_24h" ? "the last 24 hours" : "what's new since the previous digest"}.</span></li>
  </ol>`;
}
function statusSentence(s, st) {
  const d = s.digest || {};
  const every = (st.fetch_every_minutes || 120) >= 60 ? plural((st.fetch_every_minutes || 120) / 60, "hour", "hours") : `${st.fetch_every_minutes} minutes`;
  let a = s.last_export ? `Checks for new messages every ${every}; last checked at ${timeOf(s.last_export)}` + (s.last_count != null ? ` (${plural(s.last_count, "new message", "new messages")}).` : ".") : `Checks for new messages every ${every}.`;
  let b;
  if (st.digest_mode === "auto" && d.engine) b = `${d.engine_name} writes digests ${(SCHEDULES.find(x => x[0] === scheduleKey(st)) || ["", "regularly"])[1].toLowerCase()}${st.digest_schedule === "daily" ? " at " + st.digest_daily_at : ""}, when there's something new.`;
  else if (st.digest_mode === "auto") b = `Automatic digests are on, but no AI tool was found on ${HERE()}. See Digests below.`;
  else b = `Digests are written when you ask.`;
  return `${a} ${b}`;
}

function renderSettings(s) {
  const st = SETTINGS, d = s.digest || {};
  const [hc, ht] = health(s);
  const sel = (key, opts, val) => `<select data-set="${key}">${opts.map(([v, l]) => `<option value="${v}"${String(val ?? st[key]) === String(v) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const found = d.found || {}, foundNames = Object.entries(found).filter(([, v]) => v).map(([k]) => k === "claude" ? "Claude Code" : "Codex");
  const auto = st.digest_mode === "auto";
  const wasOpen = sel => document.querySelector(sel)?.open ? " open" : "";   // keep sections open across redraws
  const moreOpen = wasOpen("#digestset details.more"), advOpen = wasOpen("details.panel.advanced");
  $("#view").innerHTML = `<div class="layout single"><main class="main">
    <header class="ph"><h1>Settings</h1></header>

    <section class="panel"><h2>Status</h2>
      <p class="statusline"><span class="dot ${hc}"></span><span>${esc(ht)}.</span></p>
      ${flowSteps(s, st, sel)}
      ${!s.background ? `<p class="errc">The app isn't running in the background, so it stops when it's closed. Run the install line again to fix this.</p>` : ""}
      ${s.last_error ? `<p class="errc">${esc(s.last_error)}</p>` : ""}
      ${d.last_ok === false && d.last_message ? `<p class="errc">${esc(d.last_message)}</p>` : ""}
      <div class="row"><button class="btn ghost" id="exnow" data-busy="Checking for new messages…" ${s.exporting ? "disabled" : ""}>${s.exporting ? "Checking…" : "Check for new messages now"}</button>
        ${d.engine ? (d.running ? digestAction() : runButton(true)) : ""}
        <span id="exmsg" class="muted"></span></div>
    </section>

    <section class="panel" id="digestset"><h2>Digests</h2>
      <div class="choices compact">
        <label class="choice"><input type="radio" name="dmode" value="auto" ${auto ? "checked" : ""}><span><b>Automatically</b></span></label>
        <label class="choice"><input type="radio" name="dmode" value="manual" ${auto ? "" : "checked"}><span><b>Only when I ask</b></span></label>
      </div>
      ${auto ? `<label class="opt"><span>How often</span><select id="sched">${SCHEDULES.map(([v, l]) => `<option value="${v}"${scheduleKey(st) === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        ${st.digest_schedule === "daily" ? `<label class="opt"><span>At</span><input type="time" data-set="digest_daily_at" value="${esc(st.digest_daily_at)}"></label>` : ""}` : ""}
      <label class="opt"><span>Notify me</span>${sel("notify", [["attention", "When something needs attention"], ["all", "For every new digest"], ["off", "Never"]])}</label>
      <label class="opt"><span>Written by</span>${engineSelect(st, found)}</label>
      ${st.digest_engine !== "auto" && !found[st.digest_engine] ? `<p class="errc">${st.digest_engine === "claude" ? "Claude Code" : "Codex"} isn't installed on ${HERE()} yet. Choose another option, or install it as shown below.</p>` : ""}
      ${!d.engine && auto ? `<p class="errc">Automatic digests are on, but ${HERE()} can't write them yet.</p>${engineHelp()}
        <div class="row"><button class="btn" id="recheck2" data-busy="Checking…">Check again</button></div>` : ""}
      <details class="more"${moreOpen}><summary>More options</summary>
        ${auto ? `<label class="opt"><span>Only if there are at least</span>${sel("digest_min_new", [[1, "1 new message"], [3, "3 new messages"], [5, "5 new messages"], [10, "10 new messages"], [20, "20 new messages"]])}</label>` : ""}
        <label class="opt"><span>Each digest covers</span>${sel("digest_period", [["since_last", "Everything since the previous digest"], ["last_24h", "The last 24 hours"]])}</label>
        <label class="opt"><span>Photos</span>${sel("digest_photos", [["true", "Look at photos (up to 20 per digest)"], ["false", "Skip photos"]])}</label>
        <p class="muted small">Photos are saved on ${HERE()} as smaller previews and kept for 30 days. The digest reads what they show, like a poster's date or a screenshot's text. Each photo adds a few seconds to a digest.</p>
        ${modelOptions(st, st.digest_engine !== "auto" ? st.digest_engine : d.engine, sel)}
      </details>
    </section>

    <section class="panel" id="phone"><h2>Digests on your phone</h2><div id="botbox"></div></section>

    <section class="panel" id="prefs"><h2>What needs your attention</h2>
      <p class="muted">In your own words. The digest uses this to decide what goes under “Needs attention”. It also learns from the small buttons at the end of each digest point: the circle means “not for me”, the flag means “flag things like this”.</p>
      <div id="prefsform"><p class="muted">Loading…</p></div>
      <div class="row"><button class="btn" id="saveprefs" data-busy="Saving…">Save</button><span id="prefsmsg" class="muted"></span></div>
    </section>

    <section class="panel" id="groupsset"><h2>Groups you follow</h2><div id="groups"><p class="muted">Loading…</p></div></section>

    <details class="panel advanced"${advOpen}><summary>Advanced</summary>
      <div class="row"><span>Get older messages from Telegram:</span>
        <select id="olderdays" class="inline-select"><option value="3">last 3 days</option><option value="7">last 7 days</option><option value="31">last month</option></select>
        <button class="btn ghost" id="exre" data-busy="Getting them…">Get them</button></div>
      <dl class="facts">
        <dt>Telegram</dt><dd>${s.authorized ? `Logged in as ${esc(s.me)}` : "Not logged in"}</dd>
        <dt>Background</dt><dd>${s.background ? "Runs in the background and starts when you log in" : "Not running in the background"}</dd>
        <dt>Folder</dt><dd>TelegramDigest in your home folder</dd>
      </dl>
      <div class="row"><button class="link" id="chkeys">Use different Telegram API codes</button></div>
      <div id="keysform"></div>
    </details>
  </main></div>`;

  // status buttons
  const checkNow = days => async () => {
    $("#exmsg").textContent = "";
    try { const r = await api("/api/export", days ? { rebuild_days: days } : {}); $("#exmsg").textContent = r.busy ? "Already checking." : `Found ${plural(r.total, "new message", "new messages")}.`; }
    catch (e) { $("#exmsg").innerHTML = `<span class="errc">${esc(e.message)}</span>`; }
    await refreshStatus();
  };
  on("exnow", checkNow(null));
  on("exre", () => checkNow(+$("#olderdays").value)());
  on("recheck2", async () => { const s2 = await refreshStatus(); renderSettings(s2); });
  // digest settings
  const save = async (patch, el) => {
    if (el) { el.disabled = true; el.setAttribute("aria-busy", "true"); }   // locked while it saves
    try { SETTINGS = await api("/api/settings", patch); const s2 = await refreshStatus(); renderSettings(s2); }
    catch (e) { if (el && el.isConnected) { el.disabled = false; el.removeAttribute("aria-busy"); } alert(e.message); }
  };
  $$("input[name=dmode]").forEach(r => r.onchange = () => save({ digest_mode: r.value }, r));
  const sch = $("#sched"); if (sch) sch.onchange = () => save(scheduleSettings(sch.value), sch);
  $$("[data-set]").forEach(el => el.onchange = () => save({ [el.dataset.set]: el.value }, el));
  // preferences
  let PREFS = null;
  api("/api/preferences").then(p => { PREFS = parsePrefs(p.text); $("#prefsform").innerHTML = prefsFields(PREFS); })
    .catch(e => { $("#prefsform").innerHTML = ""; $("#prefsmsg").textContent = e.message; });
  on("saveprefs", async () => {
    if (!PREFS) return;
    try { await api("/api/preferences", { text: prefsText(PREFS, $("#prefsform")) }); $("#prefsmsg").textContent = "Saved."; }
    catch (e) { $("#prefsmsg").innerHTML = `<span class="errc">${esc(e.message)}</span>`; }
  });
  // phone
  botPanel($("#botbox"));
  // groups
  drawFollowed();
  // keys
  on("chkeys", () => {
    $("#keysform").innerHTML = `<div class="row"><input type="text" id="apiid" placeholder="App api_id" style="max-width:160px"><input type="password" id="apihash" placeholder="App api_hash">
      <button class="btn" id="savekeys" data-busy="Checking…">Save</button><span class="errc" id="kerr"></span></div>`;
    on("savekeys", async () => { try { await api("/api/keys", { api_id: $("#apiid").value, api_hash: $("#apihash").value }); renderSetup(); } catch (e) { errBox("kerr", e); } });
  });
}

async function drawFollowed() {
  const box = $("#groups");
  if (PICKER_OPEN) {
    groupPicker(box, { button: "Save", cancel: true, onSave: () => { PICKER_OPEN = false; drawFollowed(); refreshStatus(); } });
    return;
  }
  const sel = (await api("/api/selection").catch(() => ({ groups: {} }))).groups || {};
  const items = Object.values(sel);
  box.innerHTML = (items.length ? `<ul class="followed">${items.map(g => `<li>${esc(g.title || "Untitled group")}${g.topics !== "all" ? ` <span class="muted">(${plural(g.topics.length, "subgroup", "subgroups")})</span>` : g.forum ? ` <span class="muted">(all subgroups)</span>` : ""}</li>`).join("")}</ul>`
    : `<p class="muted">You're not following any groups yet.</p>`) + `<button class="btn ghost" id="changegroups">Change groups</button>`;
  on("changegroups", () => { PICKER_OPEN = true; SEL = null; drawFollowed(); });
}

// ----- group picker (used by setup and settings) -----
async function groupPicker(box, opt) {
  try {
    if (!GROUPS) GROUPS = await api("/api/groups");
    if (!SEL) SEL = (await api("/api/selection")).groups || {};
  } catch (e) { box.innerHTML = `<p class="errc">${esc(e.message)}</p>`; return; }
  ORDER = GROUPS.slice().sort((a, b) => (SEL[b.id] ? 1 : 0) - (SEL[a.id] ? 1 : 0));   // followed first, fixed while ticking
  box.innerHTML = `<input type="search" id="gfilter" placeholder="Search your ${GROUPS.length} groups and channels">
    <div id="grouplist"></div>
    <div class="row"><button class="btn" id="savesel" data-busy="Saving…">${esc(opt.button)}</button>${opt.cancel ? `<button class="link" id="cancelsel">Cancel</button>` : ""}<span id="selmsg" class="muted"></span></div>`;
  $("#gfilter").oninput = drawGroups;
  on("savesel", async () => {
    if (!Object.keys(SEL).length) { $("#selmsg").textContent = "Tick at least one group."; return; }
    try { await api("/api/selection", { groups: SEL }); await opt.onSave(); }
    catch (e) { $("#selmsg").innerHTML = `<span class="errc">${esc(e.message)}</span>`; }
  });
  on("cancelsel", () => { PICKER_OPEN = false; SEL = null; drawFollowed(); });
  drawGroups();
}

function groupState(g) { const s = SEL[g.id]; return !s ? "off" : s.topics === "all" ? "on" : "some"; }

function drawGroups() {
  const q = ($("#gfilter").value || "").toLowerCase();
  const list = ORDER.filter(g => g.title.toLowerCase().includes(q));
  $("#grouplist").innerHTML = list.map(g => {
    const st = groupState(g), open = TOPICS[g.id] && TOPICS[g.id].open;
    const n = SEL[g.id] && SEL[g.id].topics !== "all" ? `<span class="badge">${plural(SEL[g.id].topics.length, "subgroup", "subgroups")}</span>` : "";
    return `<div class="grp" data-g="${esc(g.id)}">
      <div class="row" style="margin:0"><label><input type="checkbox" class="gchk" ${st !== "off" ? "checked" : ""}><span>${esc(g.title)}</span>
        ${g.forum ? `<span class="badge">has subgroups</span>` : g.kind === "channel" ? `<span class="badge">channel</span>` : ""}${n}</label>
        ${g.forum ? `<button class="link tbtn">${open ? "Hide subgroups" : "Pick subgroups"}</button>` : ""}</div>
      ${g.forum && open ? `<div class="topics">${topicsHTML(g)}</div>` : ""}
    </div>`;
  }).join("") || `<p class="muted">No group matches.</p>`;
  $$(".grp").forEach(row => {
    const g = GROUPS.find(x => x.id === row.dataset.g), chk = $(".gchk", row);
    chk.indeterminate = groupState(g) === "some";
    chk.onchange = () => { if (chk.checked) SEL[g.id] = { title: g.title, forum: g.forum, topics: "all" }; else delete SEL[g.id]; drawGroups(); };
    const tb = $(".tbtn", row); if (tb) tb.onclick = () => toggleTopics(g);
    $$(".tchk", row).forEach(c => c.onchange = () => toggleTopic(g, +c.dataset.tid, c.checked));
  });
}

async function toggleTopics(g) {
  if (TOPICS[g.id] && TOPICS[g.id].list) { TOPICS[g.id].open = !TOPICS[g.id].open; return drawGroups(); }
  TOPICS[g.id] = { open: true, list: null }; drawGroups();
  try { TOPICS[g.id].list = await api("/api/topics?gid=" + encodeURIComponent(g.id)); } catch (e) { TOPICS[g.id].error = e.message; }
  drawGroups();
}

function topicsHTML(g) {
  const t = TOPICS[g.id];
  if (t.error) return `<span class="errc">${esc(t.error)}</span>`;
  if (!t.list) return `<span class="muted">Loading subgroups…</span>`;
  const s = SEL[g.id];
  return t.list.map(tp => `<label><input type="checkbox" class="tchk" data-tid="${tp.id}" ${s && (s.topics === "all" || s.topics.includes(tp.id)) ? "checked" : ""}> ${esc(tp.title)}</label>`).join("");
}

function toggleTopic(g, tid, on) {
  const all = TOPICS[g.id].list.map(t => t.id), s = SEL[g.id];
  let cur = s ? (s.topics === "all" ? all.slice() : s.topics.slice()) : [];
  cur = on ? [...new Set([...cur, tid])] : cur.filter(t => t !== tid);
  if (!cur.length) delete SEL[g.id];
  else SEL[g.id] = { title: g.title, forum: g.forum, topics: cur.length === all.length ? "all" : cur };
  drawGroups();
}

const NEEDS_API = 4;   // matches API_VERSION in app.py

// ---------- start ----------
(async () => {
  const s = await refreshStatus();
  SETTINGS = await api("/api/settings").catch(() => ({}));
  setTabLabel(s, SETTINGS);
  const want = location.hash.slice(1);
  const setup = needsSetup(s, SETTINGS) && !(s.keys && s.authorized && s.selected && want);
  show(setup ? "setup" : ["digest", "messages", "setup"].includes(want) ? want : "digest");
  setInterval(refreshStatus, 60000);
})();
</script>
</body>
</html>
