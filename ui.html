<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram digest</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #F3F5F1; --surface: #FFFFFF; --ink: #1E2420; --muted: #66706A; --faint: #98A29C; --line: #DDE2DC;
  --teal: #1F6F5C; --teal-soft: #E2EEE9; --sun: #D9940B; --sun-soft: #FBF0D6; --ok: #2E9E6B; --err: #B3261E;
  --name-s: 55%; --name-l: 36%; --dot-l: 48%; --tag-bg-l: 93%; --tag-fg-l: 30%;
  --ui: "Avenir Next", "Seravek", "Segoe UI", system-ui, sans-serif;
  --read: "Charter", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141916; --surface: #1B211E; --ink: #E4EAE6; --muted: #9AA5A0; --faint: #6E7974; --line: #2B332F;
    --teal: #6CC5AC; --teal-soft: #1E322B; --sun: #F0B43A; --sun-soft: #2D2614; --ok: #5CC28F; --err: #F28B82;
    --name-l: 72%; --dot-l: 62%; --tag-bg-l: 22%; --tag-fg-l: 80%;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
a { color: var(--teal); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* header */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 28px; }
.brand { font-family: var(--read); font-weight: 600; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.tabs { display: flex; gap: 22px; height: 100%; }
.tabs button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; height: 100%; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--teal); }
.health { margin-left: auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 13px; text-align: right; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--sun); } .dot.bad { background: var(--err); }

/* layout */
.layout { max-width: 1120px; margin: 0 auto; padding: 28px 24px 80px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 48px; }
.side { position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; padding-bottom: 12px; }
.main { min-width: 0; max-width: 700px; }
.layout.single { grid-template-columns: minmax(0, 1fr); }
.layout.single .main { max-width: 720px; }

.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
select, input[type=text], input[type=password], input[type=search] {
  font: inherit; font-size: 14px; width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.nav-group { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; }
.nav-item { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); }
.nav-item:hover { background: var(--surface); }
.nav-item.on { background: var(--teal-soft); color: var(--teal); font-weight: 600; }
.nav-item .n { color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 400; }
.nav-item.on .n { color: var(--teal); }
.nav-item.att { color: var(--sun); font-weight: 600; }
.nav-select { display: none; }

/* page header */
.ph { margin-bottom: 22px; }
.ph h1 { font-family: var(--read); font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; margin: 0; }
.ph .sub { color: var(--muted); margin: 6px 0 0; }
.back { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; margin-bottom: 10px; }

/* digest */
.attention { background: var(--sun-soft); border-left: 3px solid var(--sun); border-radius: 0 12px 12px 0; padding: 16px 22px 10px; margin: 0 0 30px; }
.attention h2 { font-size: 15px; margin: 0; }
.topic { border-top: 1px solid var(--line); padding: 22px 0 10px; }
.topic h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; font-size: 18px; font-weight: 600; margin: 0; }
.topic h2 .count { font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.group-title { font-family: var(--read); font-size: 22px; margin: 34px 0 6px; }
ul.pts { font-family: var(--read); font-size: 17.5px; line-height: 1.6; margin: 10px 0 8px; padding-left: 1.15em; }
ul.pts li { margin: 7px 0; padding-left: 2px; }
ul.pts li::marker { color: var(--faint); }
.pip { font: 12px/1.6 var(--ui); display: inline-flex; align-items: center; gap: 3px; padding: 0 6px 0 7px; margin: 0 0 0 5px; border-radius: 999px;
       border: 1px solid var(--line); background: var(--surface); color: var(--muted); vertical-align: 2px; white-space: nowrap; }
.pip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) var(--name-s) var(--dot-l)); margin-right: 2px; }
.pip .pn { font-weight: 600; color: hsl(var(--h) var(--name-s) var(--name-l)); margin-right: 2px; }
.pip a { color: var(--muted); text-decoration: none; padding: 0 2px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.pip a:hover, .pip a:focus-visible { color: var(--teal); text-decoration: underline; }
.toggle { background: none; border: 0; padding: 4px 0; color: var(--teal); cursor: pointer; font-size: 14px; }
.also { border-top: 1px solid var(--line); padding: 22px 0; }
.also h2 { font-size: 15px; margin: 0 0 8px; }
.also-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0; }
.empty { color: var(--muted); padding: 60px 0; max-width: 460px; }
.newer { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; margin: 0 0 24px; }
.newer b { font-weight: 600; }
.attention .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.attention .head .link { font-size: 13px; }
/* always in the layout (so nothing moves on hover); just quieter until you point at the line */
.fb { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-left: 4px; padding: 0; border: 0; border-radius: 6px;
      background: none; color: var(--faint); opacity: .45; cursor: pointer; vertical-align: -4px; }
.fb svg { width: 14px; height: 14px; }
li:hover .fb, .fb:focus-visible { opacity: 1; }
.fb:hover { color: var(--teal); background: var(--teal-soft); }
.fb.done { opacity: 1; color: var(--ok); cursor: default; background: none; }
.nav-item .nd { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.nav-item .dsub { display: block; font-size: 12px; color: var(--faint); font-weight: 400; }
textarea { font: 14px/1.5 var(--ui); width: 100%; min-height: 260px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.inline-select { width: auto; display: inline-block; }
.wizard { max-width: 620px; }
.wsteps { list-style: none; display: flex; gap: 8px; padding: 0; margin: 0 0 26px; counter-reset: s; flex-wrap: wrap; }
.wsteps li { counter-increment: s; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; }
.wsteps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
.wsteps li + li::after { content: none; }
.wsteps li:not(:last-child) { padding-right: 10px; border-right: 1px solid var(--line); }
.wsteps li.now { color: var(--ink); font-weight: 600; }
.wsteps li.now::before { background: var(--teal); border-color: var(--teal); color: var(--surface); }
.wsteps li.done { color: var(--muted); }
.wsteps li.done::before { content: "✓"; color: var(--teal); border-color: var(--teal); }
.howto { padding-left: 1.3em; margin: 0 0 18px; }
.howto li { margin: 8px 0; line-height: 1.55; }
.fields { display: grid; gap: 4px; max-width: 420px; margin: 8px 0; }
.help { margin-top: 34px; font-size: 13px; color: var(--faint); overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; margin: 6px 0 16px; }
.choices.compact { grid-template-columns: repeat(auto-fit, minmax(180px, max-content)); gap: 8px 18px; }
.choice { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.choices.compact .choice { border: 0; background: none; padding: 0; align-items: center; }
.choice:has(input:checked) { border-color: var(--teal); }
.choice input { margin-top: 4px; accent-color: var(--teal); }
.choices.compact .choice input { margin-top: 0; }
.check { display: flex; gap: 10px; align-items: center; margin: 4px 0 8px; cursor: pointer; }
.quote { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; overflow-wrap: anywhere; user-select: all; }
.quote.inline { display: inline; padding: 2px 6px; }
.ehelp { margin: 4px 0 10px; }
.howto ol.sub { padding-left: 1.2em; margin: 6px 0 10px; list-style: lower-alpha; }
.howto ol.sub li { margin: 5px 0; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
a.btn { display: inline-block; text-decoration: none; }
.ehelp .howto .quote { margin: 6px 0; }
.updatebar { max-width: 1180px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px; background: var(--sun-soft); color: var(--ink); border: 1px solid var(--sun); }
.updatebar[hidden] { display: none; }
.flow { margin: 10px 0 14px; padding: 0; list-style: none; counter-reset: flow; display: grid; gap: 10px; }
.flow li { counter-increment: flow; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; }
.flow li::before { content: counter(flow); grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: var(--surface); font: 600 12.5px/22px var(--ui); text-align: center; margin-top: 1px; }
.flow .how { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
.flow .how select { width: auto; }
.flow .muted { font-size: 14px; }
.statusline { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.followed { margin: 4px 0 12px; padding-left: 1.1em; }
.pref { display: block; margin: 12px 0; }
.plabel { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.pref textarea { min-height: 0; }
.learned { margin: 4px 0; padding-left: 1.1em; color: var(--muted); font-size: 14px; }
.small { font-size: 12.5px; }
.followed li { margin: 3px 0; }
details.more { margin-top: 10px; }
details.more > summary, details.advanced > summary { cursor: pointer; color: var(--teal); }
details.advanced > summary { font-size: 16px; font-weight: 600; color: var(--ink); }
details.advanced[open] > summary { margin-bottom: 10px; }
.opt { display: grid; grid-template-columns: 180px minmax(0, 320px); align-items: center; gap: 14px; margin: 8px 0; }
.opt > span { color: var(--muted); }
.side-actions { margin-bottom: 18px; }
.side-actions .split { width: 100%; }
.side-actions .split > .btn[data-run] { flex: 1; }
.split { position: relative; display: inline-flex; }
.split > .btn[data-run] { border-radius: 8px 0 0 8px; }
.split > .more-btn { border-radius: 0 8px 8px 0; border-left: 1px solid rgba(255, 255, 255, .35); padding: 7px 10px; letter-spacing: 1px; }
.split.ghost > .more-btn { border-left: 0; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 240px; background: var(--surface); border: 1px solid var(--line);
        border-radius: 10px; box-shadow: 0 10px 30px rgba(15, 30, 22, .14); padding: 6px; }
.menu .mh { font-size: 12.5px; color: var(--muted); padding: 6px 10px 4px; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--teal-soft); color: var(--teal); }
.menu button .def { color: var(--faint); font-size: 12.5px; margin-left: 6px; }
.tlabel { font: 600 12px/1.7 var(--ui); color: hsl(var(--h) 45% var(--tag-fg-l)); background: hsl(var(--h) 55% var(--tag-bg-l)); border: 0; border-radius: 6px;
          padding: 0 8px; margin-right: 8px; cursor: pointer; vertical-align: 1px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tlabel .tg { font-weight: 400; opacity: .75; }
.tlabel:hover { text-decoration: underline; }
.who .nm { color: hsl(var(--h) var(--name-s) var(--name-l)); }
.feedbar { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; margin: 0 0 18px; }
.feedbar .fb-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.feedbar .fb-top .lbl { font-size: 13px; color: var(--muted); }
.feedbar .fb-top .acts2 { display: flex; gap: 14px; align-items: center; font-size: 13px; }
.chipgroup { margin: 6px 0 2px; }
.chipgroup .gname { background: none; border: 0; padding: 0; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; margin-bottom: 4px; }
.chipgroup .gname:hover { color: var(--teal); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 13px var(--ui); display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px 2px 8px; cursor: pointer;
        border: 1px solid transparent; background: hsl(var(--h) 55% var(--tag-bg-l)); color: hsl(var(--h) 45% var(--tag-fg-l)); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) var(--name-s) var(--dot-l)); }
.chip .c { opacity: .7; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="false"] { background: none; border-color: var(--line); color: var(--faint); text-decoration: line-through; }
.chip[aria-pressed="false"]::before { background: var(--line); }
.sortsel { width: auto; font-size: 13px; padding: 3px 8px; }
.ph-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.nav-item.all { font-weight: 600; }
.side-actions .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
.working { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.bspin { display: inline-block; width: .95em; height: .95em; margin-right: 8px; vertical-align: -.14em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; }
.bspin:only-child { margin-right: 0; }
button[data-working] { cursor: progress; }
.btn[data-working]:disabled { opacity: 1; }
.btn[aria-busy="true"]:not(.ghost) { background: color-mix(in srgb, var(--teal) 82%, var(--surface)); }
select[aria-busy="true"] { cursor: progress; opacity: .7; }
@media (prefers-reduced-motion: reduce) { .spin, .bspin { animation: none; } }
.empty h1 { font-family: var(--read); color: var(--ink); font-size: 24px; margin: 0 0 8px; }

/* transcript */
.tx { margin: 6px 0 14px; }
.day-div { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 20px 0 6px; }
.day-div::before, .day-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.m { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 14px; padding: 2px 10px 2px 4px; border-radius: 8px; }
.m.first { margin-top: 12px; padding-top: 4px; }
.m:hover { background: var(--surface); }
.m .t { font-size: 12px; color: var(--faint); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.m:not(.first) .t { visibility: hidden; }
.m:not(.first):hover .t { visibility: visible; }
.who { font-weight: 600; font-size: 14.5px; color: hsl(var(--h) var(--name-s) var(--name-l)); }
.m .who { color: inherit; }
.fwd { font-weight: 400; font-size: 12px; color: var(--faint); margin-left: 6px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.q { display: block; border-left: 2px solid hsl(var(--h) var(--name-s) var(--dot-l)); padding: 1px 10px; margin: 3px 0 4px; font-size: 13.5px;
     color: var(--muted); text-decoration: none; border-radius: 0 6px 6px 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q b { font-weight: 600; color: hsl(var(--h) var(--name-s) var(--name-l)); margin-right: 4px; }
a.q:hover { background: var(--teal-soft); }
.q.missing { cursor: default; border-left-color: var(--line); }
.ph { display: block; width: fit-content; margin: 4px 0 6px; }
.ph img { display: block; max-width: min(100%, 340px); max-height: 300px; border-radius: 8px; border: 1px solid var(--line); background: var(--line); }
.ph:focus-visible img { outline: 2px solid var(--teal); outline-offset: 2px; }
.popimg { display: block; max-width: 100%; max-height: 180px; border-radius: 6px; margin-bottom: 6px; }
.media { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-right: 6px; white-space: nowrap; }
.mention { color: var(--teal); }
.rep { background: none; border: 0; padding: 2px 0 0; color: var(--faint); cursor: pointer; font-size: 12.5px; }
.rep:hover, .rep:focus-visible { color: var(--teal); }
.acts { font-size: 12.5px; opacity: 0; white-space: nowrap; padding-top: 2px; }
.acts a { text-decoration: none; }
.m:hover .acts, .m:focus-within .acts { opacity: 1; }
@media (hover: none) { .acts { opacity: 1; } }
.m.ref { box-shadow: inset 3px 0 0 var(--sun); border-radius: 0 8px 8px 0; }
.m.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 30% { background: var(--sun-soft); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .m.flash { animation: none; background: var(--sun-soft); } }
mark { background: var(--sun-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.hit { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 4px; cursor: pointer; }
.hit:hover { background: var(--surface); }
.hit .meta { font-size: 13px; color: var(--muted); }

/* source preview */
#pop { position: fixed; z-index: 30; width: 330px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
       padding: 12px 14px; box-shadow: 0 10px 30px rgba(15, 30, 22, .16); pointer-events: none; font-size: 14px; }
#pop .meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
#pop .meta span { color: var(--faint); font-size: 12px; }
#pop .body { max-height: 220px; overflow: hidden; }
#pop .hint { font-size: 12px; color: var(--faint); margin-top: 8px; }

/* setup */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; }
.panel h2 { font-size: 16px; margin: 0 0 10px; }
.panel p { margin: 6px 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.row input[type=text], .row input[type=password] { width: auto; flex: 1; min-width: 140px; }
input[type=checkbox] { width: auto; flex: none; margin: 0; accent-color: var(--teal); }
.btn { border: 1px solid var(--teal); background: var(--teal); color: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: none; color: var(--teal); }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; }
.muted { color: var(--muted); } .okc { color: var(--ok); } .errc { color: var(--err); }
.facts { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 14px; margin: 8px 0 12px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; display: flex; gap: 8px; align-items: baseline; }
.facts dd .dot { position: relative; top: -1px; }
.grp { border-top: 1px solid var(--line); padding: 8px 0; }
.grp:first-child { border-top: 0; }
.grp label { display: flex; gap: 10px; align-items: center; cursor: pointer; flex: 1; }
.badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.topics { margin: 6px 0 2px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 14px; }
.topics label { font-size: 14px; }
#grouplist { max-height: 55vh; overflow: auto; margin: 8px 0; }

/* narrow, including the Claude app's browser pane */
@media (max-width: 860px) {
  .top-in { padding: 0 16px; gap: 18px; }
  .brand { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 18px 16px 60px; }
  .side { position: static; max-height: none; overflow: visible; }
  .nav-list, .side > .nav-group { display: none; }
  .nav-select { display: block; }
  .side .field { margin-bottom: 8px; }
  .ph h1 { font-size: 25px; }
  ul.pts { font-size: 17px; }
  .health .htext { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .opt { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .facts dt { margin-top: 6px; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">Telegram digest</div>
  <nav class="tabs">
    <button data-tab="digest">Digest</button>
    <button data-tab="messages">Messages</button>
    <button data-tab="setup">Setup</button>
  </nav>
  <button class="health" id="health" title="Status"><span class="dot" id="hdot"></span><span class="htext" id="htext">Checking…</span></button>
</div></header>

<div id="updatebar" class="updatebar" hidden></div>
<div id="view"></div>
<div id="pop" hidden></div>

<script>
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

// Loading state for a button whose action waits on the app. The button locks at once
// (no double clicks); after a moment it shows a spinner and what it's doing, so quick
// actions don't flicker. Label comes from data-busy, else the button keeps its own text.
async function busy(btn, fn, label) {
  if (!btn || btn.dataset.working) return;
  label = label ?? btn.dataset.busy ?? btn.textContent.trim();
  const before = btn.innerHTML;
  let shown = null;
  btn.dataset.working = "1"; btn.disabled = true;
  const timer = setTimeout(() => {
    btn.style.minWidth = btn.offsetWidth + "px";       // don't let the button shrink
    btn.setAttribute("aria-busy", "true");
    btn.innerHTML = shown = `<span class="bspin" aria-hidden="true"></span>${label ? `<span>${esc(label)}</span>` : ""}`;
  }, 150);
  try { return await fn(); }
  finally {
    clearTimeout(timer);
    if (btn.isConnected) {                              // the view may have been redrawn already
      if (shown !== null && btn.innerHTML === shown) btn.innerHTML = before;
      btn.removeAttribute("aria-busy"); btn.style.minWidth = "";
      delete btn.dataset.working; btn.disabled = false;
    }
  }
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const trunc = (s, n) => (s = String(s || "")).length > n ? s.slice(0, n - 1) + "…" : s;
const oneLine = s => String(s || "").replace(/\s+/g, " ").trim();
const HUES = [4, 24, 38, 95, 140, 168, 192, 212, 236, 262, 288, 318, 340];
const hue = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return HUES[h % HUES.length]; };
const hhmm = iso => iso ? iso.slice(11, 16) : "";
const dayKey = iso => iso.slice(0, 10);
const dayLabel = key => new Date(key + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
const shortWhen = iso => new Date(iso).toLocaleString(undefined, { weekday: "long", hour: "2-digit", minute: "2-digit" });
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cssId = k => "m" + String(k).replace(/[^0-9a-z]/gi, "_");
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min} min ago`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
function localISO(d) {
  const p = n => String(n).padStart(2, "0"), o = -d.getTimezoneOffset(), sg = o >= 0 ? "+" : "-";
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sg}${p(Math.floor(Math.abs(o) / 60))}:${p(Math.abs(o) % 60)}`;
}
function richText(s) {
  return esc(s)
    .replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/(^|\s)(@\w{3,})/g, '$1<span class="mention">$2</span>');
}
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- message data ----------
function index(msgs) {
  const byId = new Map(), kids = new Map(), groups = new Map();
  for (const m of msgs) byId.set(m.group_id + ":" + m.id, m);
  for (const m of msgs) {
    if (m.reply_to) {
      const pk = m.group_id + ":" + m.reply_to;
      if (byId.has(pk)) { if (!kids.has(pk)) kids.set(pk, []); kids.get(pk).push(m); }
    }
    if (!groups.has(m.group_id)) groups.set(m.group_id, { id: m.group_id, title: m.group, topics: new Map(), count: 0 });
    const g = groups.get(m.group_id), k = String(m.topic_id);
    if (!g.topics.has(k)) g.topics.set(k, { key: k, id: m.topic_id, title: m.topic || "Chat", msgs: [] });
    g.topics.get(k).msgs.push(m);
    g.count++;
  }
  return { msgs, byId, kids, groups };
}
const sortedTopics = g => [...g.topics.values()].sort((a, b) => b.msgs.length - a.msgs.length);
const sortedGroups = idx => [...idx.groups.values()].sort((a, b) => b.count - a.count);

function threadOf(key, idx) {
  let root = key;
  const seen = new Set([key]);
  for (;;) {
    const m = idx.byId.get(root);
    if (!m || !m.reply_to) break;
    const pk = m.group_id + ":" + m.reply_to;
    if (!idx.byId.has(pk) || seen.has(pk)) break;
    seen.add(pk); root = pk;
  }
  const out = [], stack = [root], got = new Set();
  while (stack.length) {
    const k = stack.pop();
    if (got.has(k)) continue;
    got.add(k);
    const m = idx.byId.get(k);
    if (m) out.push(m);
    for (const c of idx.kids.get(k) || []) stack.push(c.group_id + ":" + c.id);
  }
  return out.sort((a, b) => (a.date < b.date ? -1 : 1));
}

// Messages from one person in a row (same subgroup, within 10 minutes) form a run.
// Newest-first reverses the order of runs but keeps each run in reading order.
function transcript(msgs, idx, opt = {}) {
  const runs = [];
  let prev = null;
  for (const m of msgs) {
    const cont = prev && dayKey(prev.date) === dayKey(m.date) && prev.sender === m.sender && !m.reply_to &&
      prev.topic_id === m.topic_id && prev.group_id === m.group_id && (new Date(m.date) - new Date(prev.date)) < 10 * 60000;
    if (cont) runs[runs.length - 1].push(m); else runs.push([m]);
    prev = m;
  }
  if (opt.newestFirst) runs.reverse();
  let html = "", lastDay = null;
  for (const run of runs) {
    const day = dayKey(run[0].date);
    if (day !== lastDay) { html += `<div class="day-div">${esc(dayLabel(day))}</div>`; lastDay = day; }
    run.forEach((m, i) => { html += msgRow(m, i === 0, idx, opt); });
  }
  return `<div class="tx">${html}</div>`;
}

function topicTag(m, withGroup) {
  const name = m.topic || m.group;
  return `<button class="tlabel" style="--h:${hue(m.group_id + name)}" data-gid="${esc(m.group_id)}" data-topic="${esc(String(m.topic_id))}" title="Open ${esc(m.group)}${m.topic ? " › " + esc(m.topic) : ""}">${withGroup && m.topic ? `<span class="tg">${esc(m.group)} › </span>` : ""}${esc(name)}</button>`;
}

function msgRow(m, first, idx, opt) {
  const key = m.group_id + ":" + m.id;
  let quote = "";
  if (m.reply_to) {
    const p = idx.byId.get(m.group_id + ":" + m.reply_to);
    quote = p
      ? `<a class="q" href="#${cssId(m.group_id + ":" + p.id)}" data-jump="${esc(m.group_id + ":" + p.id)}" style="--h:${hue(p.sender)}"><b>${esc(p.sender)}</b>${esc(trunc(oneLine(p.text || p.media), 110))}</a>`
      : `<span class="q missing">Reply to an earlier message</span>`;
  }
  const n = (idx.kids.get(key) || []).length;
  const media = m.photo
    ? `<a class="ph" href="/${esc(m.photo)}" target="_blank" rel="noopener" title="Open the photo"><img src="/${esc(m.photo)}" loading="lazy" alt="Photo from ${esc(m.sender)}"></a>`
    : m.media ? `<span class="media">${esc(m.media.replace(/^\[|\]$/g, ""))}</span>` : "";
  const head = first ? `<div class="who">${opt.labels ? topicTag(m, opt.withGroup) : ""}<span class="nm" style="--h:${hue(m.sender)}">${esc(m.sender)}</span>${m.forwarded ? '<span class="fwd">forwarded</span>' : ""}</div>` : "";
  return `<div class="m${first ? " first" : ""}${opt.refs && opt.refs.has(key) ? " ref" : ""}" id="${cssId(key)}">
    <div class="t">${hhmm(m.date)}</div>
    <div>${head}${quote}<div class="body">${media}${richText(m.text)}</div>${n && opt.threads ? `<button class="rep" data-thread="${esc(key)}">${plural(n, "reply", "replies")}</button>` : ""}</div>
    <div class="acts"><a href="${esc(m.app_link)}" title="Open this message in the Telegram app">Open in Telegram</a></div>
  </div>`;
}

function flashTo(key) {
  const el = document.getElementById(cssId(key));
  if (!el) return false;
  el.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  return true;
}

// ---------- state ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("tgd." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tgd." + k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep in memory */ } },
};
const S = { tab: null, status: {}, msgRange: "24h", msgIdx: null, sel: { gid: "*", topic: "*" }, thread: null, q: "",
            newestFirst: store.get("newestFirst", true), hidden: new Set(store.get("hiddenTopics", [])),
            digests: [], digestName: null, digest: null, dIdx: null, short: new Map(), open: new Set(), dates: [] };
let FB = {};
const ICON_MORE = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 14V2.5"/><path d="M3.5 3h8l-1.6 2.7L11.5 8.5h-8"/></svg>`;
const ICON_LESS = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M5.2 8h5.6"/></svg>`;
const ICON_DONE = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>`;
let DIGEST_TX = {};

// ---------- health ----------
function health(s) {
  if (s.down) return ["bad", "The app isn't responding"];
  if (!s.keys || !s.authorized || !s.selected) return ["warn", "Finish setup"];
  if (s.exporting) return ["ok", "Checking for new messages…"];
  if (s.last_error) return ["bad", "Couldn't check for new messages"];
  if (s.digest && s.digest.running) return ["ok", "Writing a digest…"];
  if (s.digest && s.digest.last_ok === false && s.digest.mode === "auto") return ["warn", "Last digest failed"];
  if (!s.last_export) return ["warn", "Waiting for the first check"];
  const hours = (Date.now() - new Date(s.last_export)) / 36e5;
  if (hours > (s.interval_hours || 2) + 1.5) return ["warn", `Last checked ${ago(s.last_export)}`];
  return ["ok", `Up to date, checked ${ago(s.last_export)}`];
}
let WAS_RUNNING = false, POLL = null;
async function refreshStatus() {
  try { S.status = await api("/api/status"); } catch (e) { S.status = { down: true }; }
  const old = !S.status.down && (S.status.api || 0) < NEEDS_API, bar = $("#updatebar");
  bar.hidden = !old;
  if (old) bar.innerHTML = `<b>Almost updated.</b> This page is new, but the app running in the background is still the old version, so some settings won't save. To finish, run the install line from the setup guide again. It keeps your settings and Telegram login.`;
  const [cls, text] = health(S.status);
  $("#hdot").className = "dot " + cls;
  $("#htext").textContent = text;
  const running = !!(S.status.digest && S.status.digest.running);
  if (running && !POLL) POLL = setInterval(refreshStatus, 4000);
  if (!running && POLL) { clearInterval(POLL); POLL = null; }
  if (WAS_RUNNING && !running) {            // a digest just finished
    S.digestName = null;
    if (S.tab === "digest") renderDigest();
    if (S.tab === "setup") renderSetup();
  }
  WAS_RUNNING = running;
  return S.status;
}

const engineReady = () => !!(S.status.digest && S.status.digest.engine);
const PERIOD_CHOICES = [["since_last", "Since the last digest"], ["last_24h", "Last 24 hours"], ["today", "Today so far"],
                        ["yesterday", "Yesterday"], ["last_3d", "Last 3 days"], ["last_7d", "Last 7 days"]];
function runButton(ghost) {
  const def = (SETTINGS && SETTINGS.digest_period) || "since_last";
  return `<div class="split${ghost ? " ghost" : ""}"><button class="btn${ghost ? " ghost" : ""}" data-run>Write a digest now</button><button class="btn${ghost ? " ghost" : ""} more-btn" data-runmenu aria-haspopup="true" aria-label="Choose what the digest covers" title="Choose what the digest covers">···</button>
    <div class="menu" hidden><div class="mh">Write a digest covering</div>${PERIOD_CHOICES.map(([v, l]) => `<button data-runp="${v}">${l}${v === def ? '<span class="def">usual</span>' : ""}</button>`).join("")}</div></div>`;
}
async function startDigest(period) {
  try { const r = await api("/api/digest/run", period ? { period } : {}); if (!r.busy) { S.status.digest = { ...(S.status.digest || {}), running: true }; } }
  catch (e) { alert(e.message); return; }
  await refreshStatus();
  if (S.tab === "digest") renderDigest();
  if (S.tab === "setup") renderSetup();
}
function digestAction() {
  const d = S.status.digest || {};
  if (d.running) return `<div class="working"><span class="spin"></span><span>${d.phase === "backfill" ? "Getting older messages from Telegram for that period first…" : esc(d.engine_name || "Your AI") + " is writing a digest. This can take a few minutes."}</span></div>`;
  if (!d.engine) return `<p class="note">To get a digest, ask your AI assistant for one. To have them written automatically, see Settings.</p>`;
  return runButton(false) +
    (d.last_message ? `<p class="note">${d.last_ok === false ? '<span class="errc">' + esc(d.last_message) + "</span>" : esc(d.last_message)}</p>` : "");
}
$("#health").onclick = () => show("setup");

// ---------- tabs ----------
function show(tab) {
  S.tab = tab;
  history.replaceState(null, "", "#" + tab);
  $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  hidePop();
  ({ digest: renderDigest, messages: renderMessages, setup: renderSetup })[tab]();
}
$$(".tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));

// ---------- Digest ----------
async function renderDigest() {
  const view = $("#view");
  if (!SETTINGS) SETTINGS = await api("/api/settings").catch(() => null);
  S.digests = await api("/api/digests").catch(() => []);
  if (!S.digests.length) {
    const d = S.status.digest || {};
    if (!S.status.keys || !S.status.authorized || !S.status.selected) {
      view.innerHTML = `<div class="layout single"><main class="main"><div class="empty"><h1>Almost there</h1>
        <p>Finish the setup first: connect Telegram and choose the groups you want in your digest.</p>
        <p><button class="btn" data-goto="setup">Continue setup</button></p></div></main></div>`;
      return;
    }
    view.innerHTML = `<div class="layout single"><main class="main"><div class="empty">
      <h1>No digest yet</h1>
      ${d.running ? digestAction()
        : d.engine ? `<p>${esc(d.engine_name)} can write your first digest now. After that, ${d.mode === "auto" ? "new ones arrive automatically (you can change when in Settings)" : "write one whenever you like"}.</p><p>${digestAction()}</p>`
        : `<p>Ask your AI assistant (Claude or ChatGPT, with access to the TelegramDigest folder) for your Telegram digest, or install Claude Code or Codex so digests are written automatically. It appears here, with every point linked to the messages it came from.</p>`}
      <p><button class="btn ghost" data-goto="messages">Read the messages</button></p></div></main></div>`;
    return;
  }
  if (!S.digests.find(d => d.name === S.digestName)) S.digestName = S.digests[0].name;
  view.innerHTML = `<div class="layout single"><main class="main"><p class="muted">Loading…</p></main></div>`;
  const d = await api("/api/digest?name=" + encodeURIComponent(S.digestName));
  // also load the day before, so sources and quotes from just before the period resolve
  const ctxFrom = localISO(new Date(new Date(d.from) - 864e5));
  const all = await api(`/api/messages?from=${encodeURIComponent(ctxFrom)}&to=${encodeURIComponent(d.to)}`);
  const start = new Date(d.from);
  S.digest = d; S.dAll = index(all); S.dIdx = index(all.filter(m => new Date(m.date) >= start));
  S.short = shortNames(S.dAll); S.open = new Set();
  drawDigest();
}

function rangeShort(from, to) {
  const f = new Date(from), t = new Date(to);
  const day = d => d.toLocaleDateString(undefined, { weekday: "short" });
  const tm = d => d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  return f.toDateString() === t.toDateString() ? `${day(t)} ${tm(f)}–${tm(t)}` : `${day(f)} ${tm(f)} to ${day(t)} ${tm(t)}`;
}

function digestSections() {
  const d = S.digest, idx = S.dIdx, out = [];
  const gids = [...new Set([...(d.groups || []).map(g => String(g.group_id)), ...idx.groups.keys()])];
  for (const gid of gids) {
    const dg = (d.groups || []).find(g => String(g.group_id) === gid) || { topics: [] };
    const ig = idx.groups.get(gid) || { title: dg.title, topics: new Map() };
    const used = new Set(), topics = [];
    for (const dt of dg.topics || []) {
      let hit = null;
      for (const tp of ig.topics.values()) {
        if ((dt.topic_id != null && String(dt.topic_id) === tp.key) || (dt.topic && tp.title.toLowerCase() === String(dt.topic).toLowerCase())) { hit = tp; break; }
      }
      if (hit) used.add(hit.key);
      topics.push({ title: hit ? hit.title : dt.topic, msgs: hit ? hit.msgs : [], bullets: dt.bullets || [] });
    }
    const rest = sortedTopics(ig).filter(tp => !used.has(tp.key)).map(tp => ({ title: tp.title, msgs: tp.msgs }));
    out.push({ gid, title: ig.title || dg.title || "", highlights: dg.highlights || [], topics, rest });
  }
  return out;
}

function shortNames(idx) {
  const byFirst = new Map(), out = new Map();
  for (const m of idx.msgs) {
    const f = m.sender.split(/\s+/)[0];
    if (!byFirst.has(f)) byFirst.set(f, new Set());
    byFirst.get(f).add(m.sender);
  }
  for (const [f, names] of byFirst) for (const n of names) {
    const parts = n.split(/\s+/);
    out.set(n, trunc(names.size > 1 && parts[1] ? `${f} ${parts[1][0]}.` : f, 16));
  }
  return out;
}

// Source links for one point: one pill per sender, with a link per message time.
function pips(refs, gid) {
  const items = (refs || []).map(r => ({ r, m: S.dAll.byId.get(gid + ":" + r) }));
  const found = items.filter(x => x.m).sort((a, b) => (a.m.date < b.m.date ? -1 : 1));
  let html = "";
  for (let i = 0; i < found.length;) {
    const who = found[i].m.sender, links = [];
    for (; i < found.length && found[i].m.sender === who; i++) {
      const m = found[i].m;
      links.push(`<a href="${esc(m.app_link)}" data-key="${esc(gid + ":" + m.id)}" aria-label="${esc(m.sender)} at ${hhmm(m.date)}, open in Telegram">${hhmm(m.date)}</a>`);
    }
    html += `<span class="pip" style="--h:${hue(who)}"><span class="pn">${esc(S.short.get(who) || who)}</span>${links.join("")}</span>`;
  }
  const ch = esc(String(gid).replace(/^-100/, ""));
  html += items.filter(x => !x.m).map(x => `<span class="pip" style="--h:0"><a href="tg://privatepost?channel=${ch}&post=${esc(x.r)}">#${esc(x.r)}</a></span>`).join("");
  return html;
}
function points(bullets, gid, fb) {
  return `<ul class="pts">${bullets.map(b => {
    const id = "f" + Object.keys(FB).length;
    FB[id] = { kind: fb.kind, text: b.text, topic: fb.topic };
    const label = fb.kind === "less" ? "Not for me: don't flag things like this" : "Flag things like this for me";
    return `<li>${bold(b.text)}${pips(b.refs, gid)}<button class="fb" data-fb="${id}" title="${label}" aria-label="${label}">${fb.kind === "less" ? ICON_LESS : ICON_MORE}</button></li>`;
  }).join("")}</ul>`;
}

function convParts(id, msgs, refs, labels) {
  DIGEST_TX[id] = { msgs, refs, labels };
  const open = S.open.has(id);
  return { btn: `<button class="toggle" data-expand="${id}" aria-expanded="${open}">${open ? labels[1] : labels[0]}</button>`,
           box: `<div id="${id}-x"${open ? "" : " hidden"}>${open ? transcript(msgs, S.dAll, { refs }) : ""}</div>` };
}
function convBlock(id, msgs, refs, labels) { const c = convParts(id, msgs, refs, labels); return c.btn + c.box; }

function drawDigest() {
  const d = S.digest, idx = S.dIdx, secs = digestSections();
  DIGEST_TX = {}; FB = {};
  const multi = secs.length > 1;
  const nTopics = [...idx.groups.values()].reduce((n, g) => n + g.topics.size, 0);
  const toc = [], parts = [];
  let sid = 0;
  for (const s of secs) {
    if (multi) { parts.push(`<h2 class="group-title">${esc(s.title)}</h2>`); toc.push({ group: s.title }); }
    if (s.highlights.length) {
      const id = `s${sid++}`;
      toc.push({ id, title: "Needs attention", n: s.highlights.length, att: true });
      parts.push(`<div class="attention" id="${id}"><div class="head"><h2>Needs attention</h2><button class="link" data-goto="setup:prefs">Change what counts</button></div>${points(s.highlights, s.gid, { kind: "less", topic: "Needs attention" })}</div>`);
    }
    for (const t of s.topics) {
      const id = `s${sid++}`, refs = new Set(t.bullets.flatMap(b => (b.refs || []).map(r => s.gid + ":" + r)));
      toc.push({ id, title: t.title, n: t.msgs.length });
      parts.push(`<section class="topic" id="${id}"><h2><span>${esc(t.title)}</span><span class="count">${plural(t.msgs.length, "message", "messages")}</span></h2>
        ${points(t.bullets, s.gid, { kind: "more", topic: t.title })}
        ${t.msgs.length ? convBlock(id, t.msgs, refs, ["Read the conversation", "Hide the conversation"]) : ""}</section>`);
    }
    if (s.rest.length) {
      const id = `s${sid++}`;
      toc.push({ id, title: "Also active", n: s.rest.length });
      parts.push(`<section class="also" id="${id}"><h2>Also active, not summarised</h2>${s.rest.map(t => {
        const tid = `s${sid++}`;
        const c = convParts(tid, t.msgs, new Set(), ["Read", "Hide"]);
        return `<div class="also-row"><span>${esc(t.title)} <span class="muted">(${plural(t.msgs.length, "message", "messages")})</span></span>${c.btn}</div>${c.box}`;
      }).join("")}</section>`);
    }
  }
  const nav = toc.map(x => x.group ? `<div class="nav-group">${esc(x.group)}</div>`
    : `<button class="nav-item${x.att ? " att" : ""}" data-scroll="${x.id}"><span>${esc(x.title)}</span><span class="n">${x.n}</span></button>`).join("");
  const navSel = toc.filter(x => x.id).map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join("");
  const list = S.digests.slice(0, 15);
  const pick = `<div class="nav-group">Digests</div><div class="nav-list">${list.map(x =>
      `<button class="nav-item${x.name === S.digestName ? " on" : ""}" data-digest="${esc(x.name)}"><span>${x.new && x.name !== S.digestName ? '<span class="nd" title="Not opened yet"></span>' : ""}${esc(x.title || x.name)}<span class="dsub">${esc(rangeShort(x.from, x.to))}</span></span><span class="n" title="Need attention">${x.attention || ""}</span></button>`).join("")}</div>
    <label class="field nav-select"><span>Digest</span><select id="dpick">${list.map(x => `<option value="${esc(x.name)}"${x.name === S.digestName ? " selected" : ""}>${x.new && x.name !== S.digestName ? "• " : ""}${esc(x.title || x.name)} (${esc(rangeShort(x.from, x.to))})</option>`).join("")}</select></label>
    <div class="nav-group">In this digest</div>`;
  $("#view").innerHTML = `<div class="layout">
    <aside class="side"><div class="side-actions">${digestAction()}</div>${pick}<div class="nav-list">${nav}</div>
      <label class="field nav-select"><span>Section</span><select id="dnav"><option value="">Jump to a section</option>${navSel}</select></label></aside>
    <main class="main">
      <header class="ph"><h1>${esc(d.title || dayLabel(dayKey(d.to)))}</h1>
        <p class="sub">${plural(idx.msgs.length, "message", "messages")} in ${plural(nTopics, "subgroup", "subgroups")}, from ${esc(shortWhen(d.from))} to ${esc(shortWhen(d.to))}.</p></header>
      <div id="newer"></div>
      ${parts.join("")}
    </main></div>`;
  showNewer(d);
  api("/api/seen", { name: S.digestName }).then(() => { const x = S.digests.find(y => y.name === S.digestName); if (x) x.new = false; }).catch(() => {});
  const dp = $("#dpick"); if (dp) dp.onchange = () => { S.digestName = dp.value; renderDigest(); };
  $("#dnav").onchange = e => { const el = document.getElementById(e.target.value); if (el) el.scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); e.target.value = ""; };
}

async function showNewer(d) {
  if (!S.digests[0] || S.digests[0].name !== S.digestName) return;   // only for the newest digest
  const now = new Date();
  const msgs = await api(`/api/messages?from=${encodeURIComponent(d.to)}&to=${encodeURIComponent(localISO(now))}`).catch(() => []);
  const box = $("#newer");
  if (!box || !msgs.length) return;
  const topics = new Set(msgs.map(m => m.topic || m.group));
  box.innerHTML = `<div class="newer"><span><b>${plural(msgs.length, "new message", "new messages")}</b> in ${plural(topics.size, "subgroup", "subgroups")} since this digest.</span>
    ${engineReady() && !S.status.digest.running ? `<button class="link" data-run>Write an update now</button><span class="muted">or</span>` : `<span class="muted">Ask your AI for an update, or</span>`}<button class="link" data-since>read them now</button></div>`;
}

// ---------- Messages ----------
function rangeFor(key) {
  if (key === "since") {
    const last = S.digests[0];
    if (last) return { from: new Date(last.to), to: new Date(), label: "since the last digest" };
    key = "24h";
  }
  if (key === "24h") { const to = new Date(); return { from: new Date(to - 864e5), to, label: "in the last 24 hours" }; }
  const from = new Date(key + "T00:00:00");
  return { from, to: new Date(from.getTime() + 864e5), label: "on " + dayLabel(key) };
}

async function renderMessages() {
  $("#view").innerHTML = `<div class="layout single"><main class="main"><p class="muted">Loading…</p></main></div>`;
  S.dates = await api("/api/dates").catch(() => []);
  if (!S.digests.length) S.digests = await api("/api/digests").catch(() => []);
  await loadMessages();
}

async function loadMessages() {
  const r = rangeFor(S.msgRange);
  const msgs = await api(`/api/messages?from=${encodeURIComponent(localISO(r.from))}&to=${encodeURIComponent(localISO(r.to))}`);
  S.msgIdx = index(msgs);
  const idx = S.msgIdx;
  const ok = S.sel && (S.sel.gid === "*" || (idx.groups.has(S.sel.gid) &&
    (S.sel.topic === "*" || idx.groups.get(S.sel.gid).topics.has(S.sel.topic))));
  if (!ok) { S.sel = { gid: "*", topic: "*" }; S.thread = null; }
  drawMessages();
}

function drawMessages() {
  const idx = S.msgIdx, r = rangeFor(S.msgRange);
  const rangeOpts = (S.digests.length ? `<option value="since"${S.msgRange === "since" ? " selected" : ""}>Since the last digest</option>` : "") +
    `<option value="24h"${S.msgRange === "24h" ? " selected" : ""}>Last 24 hours</option>` +
    S.dates.map(d => `<option value="${d}"${S.msgRange === d ? " selected" : ""}>${esc(dayLabel(d))}</option>`).join("");
  const groups = sortedGroups(idx), multi = groups.length > 1;
  const isSel = (gid, topic) => S.sel && S.sel.gid === gid && S.sel.topic === topic && !S.q;
  let nav = idx.msgs.length ? `<button class="nav-item all${isSel("*", "*") ? " on" : ""}" data-gid="*" data-topic="*"><span>All messages</span><span class="n">${idx.msgs.length}</span></button>` : "";
  let navSel = idx.msgs.length ? `<option value="*|*"${isSel("*", "*") ? " selected" : ""}>All messages (${idx.msgs.length})</option>` : "";
  for (const g of groups) {
    const plain = g.topics.size === 1 && [...g.topics.values()][0].title === "Chat";
    if (plain) {   // a group without subgroups: one entry is enough
      const t = [...g.topics.values()][0];
      nav += `<div class="nav-group">${esc(g.title)}</div><button class="nav-item${isSel(g.id, t.key) ? " on" : ""}" data-gid="${esc(g.id)}" data-topic="${esc(t.key)}"><span>All messages in this group</span><span class="n">${g.count}</span></button>`;
      navSel += `<option value="${esc(g.id + "|" + t.key)}"${isSel(g.id, t.key) ? " selected" : ""}>${esc(g.title)} (${g.count})</option>`;
      continue;
    }
    nav += `<div class="nav-group">${esc(g.title)}</div>`;
    if (multi) {
      nav += `<button class="nav-item${isSel(g.id, "*") ? " on" : ""}" data-gid="${esc(g.id)}" data-topic="*"><span>All of this group</span><span class="n">${g.count}</span></button>`;
      navSel += `<option value="${esc(g.id)}|*"${isSel(g.id, "*") ? " selected" : ""}>All of ${esc(g.title)} (${g.count})</option>`;
    }
    navSel += `<optgroup label="${esc(g.title)}">`;
    for (const t of sortedTopics(g)) {
      const on = S.sel && S.sel.gid === g.id && S.sel.topic === t.key && !S.q;
      nav += `<button class="nav-item${on ? " on" : ""}" data-gid="${esc(g.id)}" data-topic="${esc(t.key)}"><span>${esc(t.title)}</span><span class="n">${t.msgs.length}</span></button>`;
      navSel += `<option value="${esc(g.id + "|" + t.key)}"${on ? " selected" : ""}>${esc(t.title)} (${t.msgs.length})</option>`;
    }
    navSel += `</optgroup>`;
  }
  let main;
  if (!idx.msgs.length) {
    main = `<div class="empty"><h1>Nothing here yet</h1><p>No messages were saved ${esc(r.label)}. If you've just set things up, give it a minute, or use “Check for new messages now” in Settings.</p></div>`;
  } else if (S.q) {
    main = searchResults(idx);
  } else if (S.thread) {
    const msgs = threadOf(S.thread, idx), root = msgs[0];
    const g = S.sel.gid !== "*" ? idx.groups.get(S.sel.gid) : null;
    const backTo = S.sel.gid === "*" ? "all messages" : S.sel.topic === "*" ? (g ? g.title : "") : (g && g.topics.get(S.sel.topic) ? g.topics.get(S.sel.topic).title : "");
    main = `<button class="back" data-back>Back${backTo ? " to " + esc(backTo) : ""}</button>
      <header class="ph"><h1>Thread</h1><p class="sub">Started by ${esc(root.sender)} at ${hhmm(root.date)}${root.topic ? " in " + esc(root.topic) : ""}, ${plural(msgs.length, "message", "messages")}.</p></header>
      ${transcript(msgs, idx, { threads: false, refs: new Set([S.thread]) })}`;
  } else if (S.sel.topic === "*") {
    const g = S.sel.gid === "*" ? null : idx.groups.get(S.sel.gid);
    const inView = g ? [g] : sortedGroups(idx);
    const all = [].concat(...inView.map(x => [].concat(...[...x.topics.values()].map(t => t.msgs)))).sort((a, b) => (a.date < b.date ? -1 : 1));
    const shown = all.filter(m => !S.hidden.has(m.group_id + ":" + m.topic_id));
    const topics = [].concat(...inView.map(x => sortedTopics(x).map(t => ({ g: x, t }))));
    const nOn = topics.filter(({ g: x, t }) => !S.hidden.has(x.id + ":" + t.key)).length;
    main = `<header class="ph ph-row"><div><h1>${g ? esc(g.title) : "All messages"}</h1>
        <p class="sub">${shown.length === all.length ? plural(all.length, "message", "messages") : `${shown.length} of ${plural(all.length, "message", "messages")}`} from ${nOn === topics.length ? plural(topics.length, "subgroup", "subgroups") : `${nOn} of ${plural(topics.length, "subgroup", "subgroups")}`} ${esc(r.label)}.</p></div>
        ${sortControl()}</header>
      ${feedBar(inView)}
      ${shown.length ? transcript(shown, idx, { threads: true, labels: true, withGroup: !g && inView.length > 1, newestFirst: S.newestFirst })
        : `<div class="empty"><h1>Everything is hidden</h1><p>Turn subgroups back on above, or <button class="link" data-chips="all">show all</button>.</p></div>`}`;
  } else {
    const g = idx.groups.get(S.sel.gid), t = g.topics.get(S.sel.topic);
    const plainT = t.title === "Chat";
    main = `<header class="ph ph-row"><div><h1>${esc(plainT ? g.title : t.title)}</h1><p class="sub">${plainT ? "" : esc(g.title) + ", "}${plural(t.msgs.length, "message", "messages")} ${esc(r.label)}.</p></div>${sortControl()}</header>
      ${transcript(t.msgs, idx, { threads: true, newestFirst: S.newestFirst })}`;
  }
  $("#view").innerHTML = `<div class="layout">
    <aside class="side">
      <label class="field"><span>Period</span><select id="mrange">${rangeOpts}</select></label>
      <label class="field"><span>Search</span><input type="search" id="mq" placeholder="Words or a name" value="${esc(S.q)}"></label>
      ${navSel ? `<label class="field nav-select"><span>Subgroup</span><select id="mnav">${navSel}</select></label>` : ""}
      <div class="nav-list">${nav}</div>
    </aside>
    <main class="main">${main}</main></div>`;
  $("#mrange").onchange = e => { S.msgRange = e.target.value; S.thread = null; loadMessages(); };
  const q = $("#mq");
  q.oninput = () => { clearTimeout(q._t); q._t = setTimeout(() => {
    S.q = q.value.trim(); S.thread = null; drawMessages();
    const n = $("#mq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  const mn = $("#mnav"); if (mn) mn.onchange = e => { const [gid, topic] = e.target.value.split("|"); S.sel = { gid, topic }; S.thread = null; S.q = ""; drawMessages(); };
}

function sortControl() {
  return `<select class="sortsel" data-sort aria-label="Order of messages"><option value="new"${S.newestFirst ? " selected" : ""}>Newest first</option><option value="old"${S.newestFirst ? "" : " selected"}>Oldest first</option></select>`;
}

function feedBar(groups) {
  const multi = groups.length > 1;
  const body = groups.map(g => {
    const ts = sortedTopics(g);
    if (ts.length < 2 && !multi) return "";
    const chips = ts.map(t => {
      const k = g.id + ":" + t.key, on = !S.hidden.has(k);
      return `<button class="chip" style="--h:${hue(g.id + (t.title === "Chat" ? g.title : t.title))}" data-chip="${esc(k)}" aria-pressed="${on}" title="${on ? "Hide" : "Show"} ${esc(t.title)}">${esc(t.title === "Chat" ? g.title : t.title)} <span class="c">${t.msgs.length}</span></button>`;
    }).join("");
    return `<div class="chipgroup">${multi ? `<button class="gname" data-chipgroup="${esc(g.id)}" title="Show or hide all of ${esc(g.title)}">${esc(g.title)}</button>` : ""}<div class="chips">${chips}</div></div>`;
  }).join("");
  if (!body.trim()) return "";
  return `<div class="feedbar"><div class="fb-top"><span class="lbl">Show messages from</span>
    <span class="acts2"><button class="link" data-chips="all">Show all</button><button class="link" data-chips="none">Hide all</button></span></div>${body}</div>`;
}

function saveHidden() { store.set("hiddenTopics", [...S.hidden]); }

function searchResults(idx) {
  const q = S.q.toLowerCase();
  const hits = idx.msgs.filter(m => (m.text + " " + m.sender + " " + m.media).toLowerCase().includes(q));
  if (S.newestFirst) hits.reverse();
  if (!hits.length) return `<div class="empty"><h1>No matches</h1><p>Nothing ${esc(rangeFor(S.msgRange).label)} mentions “${esc(S.q)}”.</p></div>`;
  const re = new RegExp(S.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  const mark = s => esc(s).replace(re, x => `<mark>${x}</mark>`);
  return `<header class="ph"><h1>Search</h1><p class="sub">${plural(hits.length, "message", "messages")} matching “${esc(S.q)}”.</p></header>` +
    hits.map(m => `<button class="hit" data-open="${esc(m.group_id + "|" + m.topic_id + "|" + m.group_id + ":" + m.id)}">
      <div class="meta">${esc(m.topic || m.group)}, ${hhmm(m.date)}</div>
      <div class="who" style="--h:${hue(m.sender)}">${mark(m.sender)}</div>
      <div class="body">${mark(trunc(m.text || m.media, 280))}</div></button>`).join("");
}

// ---------- shared clicks ----------
document.addEventListener("click", e => {
  const mb = e.target.closest("[data-runmenu]");
  $$(".menu").forEach(m => { if (!mb || m !== mb.nextElementSibling) m.hidden = true; });
  if (mb) { const m = mb.nextElementSibling; m.hidden = !m.hidden; if (!m.hidden) { const f = m.querySelector("button"); if (f) f.focus(); } return; }
  const rp = e.target.closest("[data-runp]");
  if (rp) {
    const runBtn = rp.closest(".split")?.querySelector("[data-run]") || rp;
    busy(runBtn, () => startDigest(rp.dataset.runp === "since_last" ? null : rp.dataset.runp), "Starting…");
    return;
  }
  const ip = e.target.closest("[data-ipick]");
  if (ip) {
    INSTALL_PICK = ip.dataset.ipick;
    const box = ip.closest(".ehelp");
    if (box) box.outerHTML = engineHelp();
    return;
  }
  const chip = e.target.closest("[data-chip],[data-chips],[data-chipgroup]");
  if (chip) {
    const d = chip.dataset, idx = S.msgIdx;
    const keysOf = g => [...g.topics.values()].map(t => g.id + ":" + t.key);
    if (d.chip) { S.hidden.has(d.chip) ? S.hidden.delete(d.chip) : S.hidden.add(d.chip); }
    else if (d.chipgroup) {
      const ks = keysOf(idx.groups.get(d.chipgroup)), anyOn = ks.some(k => !S.hidden.has(k));
      ks.forEach(k => anyOn ? S.hidden.add(k) : S.hidden.delete(k));
    } else {
      const groups = S.sel.gid === "*" ? [...idx.groups.values()] : [idx.groups.get(S.sel.gid)];
      groups.forEach(g => keysOf(g).forEach(k => d.chips === "all" ? S.hidden.delete(k) : S.hidden.add(k)));
    }
    saveHidden();
    const y = window.scrollY; drawMessages(); window.scrollTo(0, y);
    return;
  }
  const t = e.target.closest("[data-jump],[data-thread],[data-back],[data-gid],[data-open],[data-scroll],[data-expand],[data-goto],[data-digest],[data-fb],[data-since],[data-run]");
  if (!t) return;
  const d = t.dataset;
  if (d.jump) {
    e.preventDefault();
    if (!flashTo(d.jump) && S.tab === "messages") { S.thread = d.jump; drawMessages(); window.scrollTo(0, 0); }
  } else if (d.thread) {
    S.thread = d.thread; drawMessages(); window.scrollTo(0, 0);
  } else if (t.hasAttribute("data-back")) {
    const k = S.thread; S.thread = null; drawMessages(); flashTo(k);
  } else if (d.gid) {
    S.sel = { gid: d.gid, topic: d.topic }; S.thread = null; S.q = ""; drawMessages(); window.scrollTo(0, 0);
  } else if (d.open) {
    const [gid, topic, key] = d.open.split("|");
    S.sel = { gid, topic }; S.q = ""; S.thread = null; drawMessages(); flashTo(key);
  } else if (d.scroll) {
    const el = document.getElementById(d.scroll);
    if (el) el.scrollIntoView({ behavior: reduced ? "auto" : "smooth" });
  } else if (d.expand) {
    const id = d.expand, box = document.getElementById(id + "-x"), tx = DIGEST_TX[id];
    const opening = box.hidden;
    if (opening && !box.innerHTML) box.innerHTML = transcript(tx.msgs, S.dAll, { refs: tx.refs });
    box.hidden = !opening;
    opening ? S.open.add(id) : S.open.delete(id);
    t.textContent = opening ? tx.labels[1] : tx.labels[0];
    t.setAttribute("aria-expanded", opening);
  } else if (d.goto) {
    const [tab, anchor] = d.goto.split(":");
    show(tab);
    if (anchor) S.scrollTo = anchor;
  } else if (d.digest) {
    S.digestName = d.digest; renderDigest(); window.scrollTo(0, 0);
  } else if (d.fb) {
    const f = FB[d.fb];
    if (!f || t.classList.contains("done")) return;
    busy(t, () => api("/api/feedback", f).then(() => { t.innerHTML = ICON_DONE; t.classList.add("done"); t.title = "Noted. The digest will take this into account."; t.setAttribute("aria-label", t.title); })
      .catch(err => { t.title = "Couldn't save: " + err.message; }), "");
  } else if (t.hasAttribute("data-run")) {
    busy(t, () => startDigest(), "Starting…");
  } else if (t.hasAttribute("data-since")) {
    S.msgRange = "since"; S.thread = null; S.q = ""; show("messages");
  }
});

// ---------- source preview on hover ----------
const pop = $("#pop");
function hidePop() { pop.hidden = true; }
function showPop(a) {
  const m = S.dAll && S.dAll.byId.get(a.dataset.key);
  if (!m) return;
  pop.innerHTML = `<div class="meta"><b class="who" style="--h:${hue(m.sender)}">${esc(m.sender)}</b><span>${esc(m.topic || m.group)}, ${hhmm(m.date)}</span></div>
    <div class="body">${m.photo ? `<img class="popimg" src="/${esc(m.photo)}" alt="">` : m.media ? `<span class="media">${esc(m.media.replace(/^\[|\]$/g, ""))}</span>` : ""}${esc(trunc(m.text, 420))}</div>
    <div class="hint">Click to open in Telegram</div>`;
  pop.hidden = false;
  const r = a.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const x = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), innerWidth - w - 12);
  let y = r.bottom + 8;
  if (y + h > innerHeight - 12) y = r.top - h - 8;
  pop.style.left = x + "px"; pop.style.top = Math.max(12, y) + "px";
}
document.addEventListener("mouseover", e => { const a = e.target.closest(".pip a[data-key]"); if (a) showPop(a); });
document.addEventListener("mouseout", e => { if (e.target.closest(".pip a[data-key]")) hidePop(); });
document.addEventListener("focusin", e => { const a = e.target.closest(".pip a[data-key]"); a ? showPop(a) : hidePop(); });
addEventListener("scroll", hidePop, { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape") $$(".menu").forEach(m => m.hidden = true); });
document.addEventListener("change", e => {
  if (e.target.matches("[data-sort]")) { S.newestFirst = e.target.value === "new"; store.set("newestFirst", S.newestFirst); drawMessages(); }
});

// ---------- Setup (first run) and Settings ----------
let GROUPS = null, SEL = null, TOPICS = {}, NEED_PW = false, SETTINGS = null, PICKER_OPEN = false, ORDER = [];
const GUIDE_URL = "https://raw.githubusercontent.com/m3h0w/telegram-digest/main/AI-SETUP.md";
const needsSetup = (s, st) => !s.keys || !s.authorized || !s.selected || !(st && st.onboarded);
const wizardStep = s => !s.keys ? 1 : !s.authorized ? 2 : !s.selected ? 3 : !(SETTINGS && SETTINGS.digests_chosen) ? 4 : 5;
const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = e => busy(b, () => fn(e)); };
const errBox = (id, e) => { const el = $("#" + id); if (el) el.textContent = e ? e.message : ""; };
function setTabLabel(s, st) { $(".tabs button[data-tab=setup]").textContent = needsSetup(s, st) ? "Setup" : "Settings"; }
const timeOf = iso => new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });

async function renderSetup() {
  const s = await refreshStatus();
  SETTINGS = await api("/api/settings").catch(() => ({}));
  setTabLabel(s, SETTINGS);
  if (needsSetup(s, SETTINGS)) renderWizard(s); else renderSettings(s);
  if (S.scrollTo) { const el = document.getElementById(S.scrollTo); S.scrollTo = null; if (el) el.scrollIntoView(); }
}

// ----- guided setup -----
function wizardFrame(step, title, intro, body) {
  const names = ["Connect Telegram", "Log in", "Choose groups", "Digests", "Phone"];
  return `<div class="layout single"><main class="main wizard">
    <ol class="wsteps">${names.map((n, i) => `<li class="${i + 1 < step ? "done" : i + 1 === step ? "now" : ""}">${esc(n)}</li>`).join("")}</ol>
    <header class="ph"><h1>${esc(title)}</h1>${intro ? `<p class="sub">${intro}</p>` : ""}</header>
    ${body}
    <p class="help">Stuck? Ask your AI assistant (Claude or ChatGPT): “Help me set up Telegram Digest, following ${esc(GUIDE_URL)}”</p>
  </main></div>`;
}

function renderWizard(s) {
  const step = wizardStep(s);
  if (step === 1) {
    $("#view").innerHTML = wizardFrame(1, "Connect to Telegram",
      "Telegram gives every app two codes of its own. Getting them takes about two minutes.",
      `<ol class="howto">
        <li>Open <a href="https://my.telegram.org" target="_blank" rel="noopener">my.telegram.org</a> and log in with your phone number. The code arrives in your Telegram app, not by text message.</li>
        <li>Click <b>API development tools</b>. Fill in <b>App title</b>: My Digest, <b>Short name</b>: any letters and numbers (for example mydigest2026), <b>Platform</b>: Desktop. Click <b>Create application</b>.</li>
        <li>Copy <b>App api_id</b> and <b>App api_hash</b> into the boxes below.</li>
      </ol>
      <div class="fields">
        <label class="field"><span>App api_id</span><input type="text" id="apiid" inputmode="numeric" placeholder="A number, like 31234567"></label>
        <label class="field"><span>App api_hash</span><input type="password" id="apihash" placeholder="32 letters and numbers"></label>
      </div>
      <div class="row"><button class="btn" id="savekeys" data-busy="Checking…">Continue</button><span class="errc" id="werr"></span></div>`);
    on("savekeys", async () => {
      errBox("werr");
      try { await api("/api/keys", { api_id: $("#apiid").value, api_hash: $("#apihash").value }); renderSetup(); } catch (e) { errBox("werr", e); }
    });
  } else if (step === 2) {
    let body;
    if (NEED_PW) body = `<p>Your account has a two-step verification password. Type it to finish logging in.</p>
      <div class="fields"><label class="field"><span>Password</span><input type="password" id="pw"></label></div>
      <div class="row"><button class="btn" id="sendpw" data-busy="Logging in…">Log in</button><span class="errc" id="werr"></span></div>`;
    else if (s.code_sent) body = `<p>Telegram just sent a code to your Telegram app (not by text message). Type it here.</p>
      <div class="fields"><label class="field"><span>Code</span><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"></label></div>
      <div class="row"><button class="btn" id="sendcode" data-busy="Logging in…">Log in</button><button class="link" id="restart">Use a different number</button><span class="errc" id="werr"></span></div>`;
    else body = `<p>This lets the app read your groups. It can't send anything, and nothing is marked as read. You'll see it in Telegram under Settings, Devices, where you can remove it any time.</p>
      <div class="fields"><label class="field"><span>Your phone number, with country code</span><input type="text" id="phone" inputmode="tel" placeholder="+48 600 000 000"></label></div>
      <div class="row"><button class="btn" id="sendphone" data-busy="Sending…">Send me a code</button><span class="errc" id="werr"></span></div>`;
    $("#view").innerHTML = wizardFrame(2, "Log in to Telegram", "", body);
    const go = (fn) => async () => { errBox("werr"); try { await fn(); } catch (e) { errBox("werr", e); } };
    on("sendphone", go(async () => { await api("/api/login/phone", { phone: $("#phone").value }); renderSetup(); }));
    on("sendcode", go(async () => { const r = await api("/api/login/code", { code: $("#code").value }); NEED_PW = !!r.need_password; renderSetup(); }));
    on("sendpw", go(async () => { await api("/api/login/password", { password: $("#pw").value }); NEED_PW = false; renderSetup(); }));
    on("restart", go(async () => { await api("/api/login/reset", {}); NEED_PW = false; renderSetup(); }));
  } else if (step === 3) {
    $("#view").innerHTML = wizardFrame(3, "Choose what to follow",
      `Tick the groups you want in your digest. For groups with subgroups, all subgroups are included unless you pick some.`,
      `<div id="groups"><p class="muted">Loading your groups…</p></div>`);
    groupPicker($("#groups"), {
      button: "Continue",
      onSave: async () => {
        $("#groups .row").innerHTML = `<div class="working"><span class="spin"></span><span>Getting the last day of messages…</span></div>`;
        await api("/api/export", {}).catch(() => {});
        renderSetup();
      },
    });
  } else if (step === 4) {
    renderDigestStep(s);
  } else {
    renderPhoneStep(s);
  }
}

function renderPhoneStep(s) {
  $("#view").innerHTML = wizardFrame(5, "Get digests on your phone too?",
    "Optional. Your digests can arrive as Telegram messages from your own private bot, so you see them on your phone wherever you are.",
    `<div id="botbox"></div>
     <div class="row wizard-end">${S.status.bot && S.status.bot.connected ? `<button class="btn" id="wdone" data-busy="Finishing…">Finish</button>` : `<button class="btn ghost" id="wdone" data-busy="Finishing…">Skip for now</button><span class="muted">You can set this up later in Settings.</span>`}</div>`);
  botPanel($("#botbox"), { open: true, onConnected: () => renderPhoneStep(S.status) });
  on("wdone", async () => { stopBotPoll(); await api("/api/settings", { onboarded: true }); SETTINGS = await api("/api/settings"); setTabLabel(S.status, SETTINGS); show("digest"); });
}

function renderDigestStep(s) {
  const d = s.digest || {};
  let body;
  if (d.engine) {
    body = `<div class="choices">
        <label class="choice"><input type="radio" name="dmode" value="auto" checked><span><b>Automatically</b> (recommended)<br>
          <span class="muted">${esc(d.engine_name)} writes them on ${HERE()}, using your ${d.engine === "claude" ? "Claude" : "ChatGPT"} plan.</span></span></label>
        <label class="choice"><input type="radio" name="dmode" value="manual"><span><b>Only when I ask</b><br>
          <span class="muted">Click “Write a digest now”, or ask your AI assistant.</span></span></label>
      </div>
      <label class="opt" id="wschedrow"><span>How often</span><select id="wsched">${SCHEDULES.filter(([v]) => v !== "daily").map(([v, l]) => `<option value="${v}"${v === "h4" ? " selected" : ""}>${l}${v === "h4" ? " (recommended)" : ""}</option>`).join("")}</select></label>
      <p class="muted">The app copies new messages from your groups to ${HERE()} every 2 hours. Each digest sums up what's new since the previous one, and a digest is only written when there is something new.</p>
      ${d.found && d.found.claude && d.found.codex ? `<label class="opt"><span>Written by</span><select id="wengine">
          <option value="auto">Claude Code (automatic choice)</option><option value="claude">Claude Code, always</option><option value="codex">Codex</option></select></label>` : ""}
      <label class="check"><input type="checkbox" id="wnotify" checked> Notify me on ${HERE()} when something needs my attention</label>
      <label class="field pref"><span class="plabel">Anything that should always need your attention? (optional)</span>
        <textarea id="walways" rows="3" placeholder="One per line, for example: kitchen shifts, the sauna, anything from Rosaura"></textarea></label>
      <p class="muted">You can change all of this any time in Settings.</p>
      <div class="row"><button class="btn" id="finish" data-busy="Starting your digest…">Continue and write my first digest</button><span class="errc" id="werr"></span></div>`;
  } else {
    body = `${engineHelp()}
      <div class="row"><button class="btn" id="recheck" data-busy="Checking…">Check again</button><button class="btn ghost" id="skip" data-busy="Saving…">Skip, I'll ask my AI for digests</button><span class="errc" id="werr"></span></div>`;
  }
  $("#view").innerHTML = wizardFrame(4, "How should digests be made?", "", body);
  $$("input[name=dmode]").forEach(r => r.onchange = () => { const row = $("#wschedrow"); if (row) row.hidden = $("input[name=dmode]:checked").value !== "auto"; });
  on("recheck", async () => { await refreshStatus(); renderSetup(); });
  on("skip", async () => {
    try { await api("/api/settings", { digests_chosen: true, digest_mode: "manual" }); renderSetup(); } catch (e) { errBox("werr", e); }
  });
  on("finish", async () => {
    const mode = $("input[name=dmode]:checked").value;
    try {
      const extra = $("#walways").value.split("\n").map(x => x.trim()).filter(Boolean);
      if (extra.length) {
        const p = parsePrefs((await api("/api/preferences")).text);
        const sec = p.sections.find(x => x.title.toLowerCase() === 'always put in "needs attention"');
        sec.items.push(...extra);
        await api("/api/preferences", { text: prefsText(p, document.createElement("div")) });
      }
      const eng = $("#wengine") ? $("#wengine").value : "auto";
      const r = await api("/api/settings", { digests_chosen: true, digest_mode: mode, digest_engine: eng, notify: $("#wnotify").checked ? "attention" : "off",
                                             ...(mode === "auto" ? scheduleSettings($("#wsched").value) : {}) });
      if (!r.digests_chosen) throw new Error("The app running in the background is an older version and didn't save this. Run the install line from the setup guide again, then try once more.");
      await api("/api/digest/run", {});
      await refreshStatus();
      renderSetup();
    } catch (e) { errBox("werr", e); }
  });
}

// ----- what-matters.md as simple fields -----
const PREF_LABELS = {
  'always put in "needs attention"': ["Always flag these", "One per line, for example: anything about kitchen shifts"],
  "usually not important": ["Usually not important", "One per line, for example: shopping lists"],
  "people and topics i follow closely": ["People and topics I care about", "One per line, for example: Rosaura, the welcome team"],
};
const FEEDBACK = "feedback from the digest";
function parsePrefs(text) {
  const lines = String(text || "").split("\n"), out = { intro: [], sections: [] };
  let cur = null;
  for (const line of lines) {
    if (/^##\s+/.test(line)) { cur = { title: line.replace(/^##\s+/, "").trim(), items: [] }; out.sections.push(cur); }
    else if (!cur) { if (!/^#\s/.test(line)) out.intro.push(line); }
    else if (line.trim()) cur.items.push(line.replace(/^\s*[-*]\s+/, "").trim());
  }
  for (const key of Object.keys(PREF_LABELS)) {
    if (!out.sections.find(x => x.title.toLowerCase() === key)) {
      const title = key === 'always put in "needs attention"' ? 'Always put in "Needs attention"' : key[0].toUpperCase() + key.slice(1);
      out.sections.push({ title, items: [] });
    }
  }
  return out;
}
function prefsFields(p) {
  return p.sections.map((sec, i) => {
    const k = sec.title.toLowerCase();
    if (k === FEEDBACK) {
      return sec.items.length ? `<div class="pref"><span class="plabel">Learned from your clicks</span>
        <ul class="learned">${sec.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <span class="muted small">The digest turns these into rules over time.</span></div>` : "";
    }
    const [label, hint] = PREF_LABELS[k] || [sec.title, ""];
    return `<label class="pref"><span class="plabel">${esc(label)}</span>
      <textarea data-sec="${i}" rows="${Math.max(2, sec.items.length + 1)}" placeholder="${esc(hint)}">${esc(sec.items.join("\n"))}</textarea></label>`;
  }).join("");
}
function prefsText(p, root) {
  $$("textarea[data-sec]", root).forEach(t => { p.sections[+t.dataset.sec].items = t.value.split("\n").map(x => x.trim()).filter(Boolean); });
  const intro = p.intro.join("\n").trim();
  return "# What matters to me\n\n" + (intro ? intro + "\n\n" : "") +
    p.sections.map(sec => `## ${sec.title}\n` + sec.items.map(x => `- ${x}`).join("\n")).join("\n\n") + "\n";
}

function engineSelect(st, found) {
  const autoName = found.claude ? "Claude Code" : found.codex ? "Codex" : null;
  const opts = [["auto", autoName ? `Automatic choice (now: ${autoName})` : "Automatic choice"],
                ["claude", "Claude Code" + (found.claude ? "" : " (not installed)")],
                ["codex", "Codex" + (found.codex ? "" : " (not installed)")]];
  return `<select data-set="digest_engine">${opts.map(([v, l]) => `<option value="${v}"${st.digest_engine === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
}

// model and effort for whichever tool writes the digests; empty = the tool's own default

  if (kind === "claude") return `
    <label class="opt"><span>Claude model</span>${sel("claude_model", [["", "Claude Code's default"], ["sonnet", "Sonnet"], ["opus", "Opus"], ["haiku", "Haiku (fastest)"], ["fable", "Fable"]])}</label>
    <label class="opt"><span>Thinking effort</span>${sel("claude_effort", [["", "Claude Code's default"], ["low", "Low (fastest)"], ["medium", "Medium"], ["high", "High"], ["xhigh", "Extra high"], ["max", "Max (slowest)"]])}</label>
    <p class="muted small">Leave these on the default unless digests are slow or miss things. Bigger models and more effort use up your Claude plan's limits faster.</p>`;
  if (kind === "codex") return `
    <label class="opt"><span>Codex model</span><input type="text" data-set="codex_model" value="${esc(st.codex_model || "")}" placeholder="Codex's default" spellcheck="false" autocomplete="off"></label>
    <label class="opt"><span>Thinking effort</span>${sel("codex_effort", [["", "Codex's default"], ["minimal", "Minimal (fastest)"], ["low", "Low"], ["medium", "Medium"], ["high", "High"], ["xhigh", "Extra high (slowest)"]])}</label>

  return "";
}
